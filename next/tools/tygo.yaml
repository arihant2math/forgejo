# tygo configuration for next/tools/gen-protocol.sh: Go wire types in
# services/livesync/protocol → next/src/protocol/types.gen.ts.
# Paths are relative to the repository root (the script runs tygo from there).
packages:
  - path: "forgejo.org/services/livesync/protocol"
    output_path: "next/src/protocol/types.gen.ts"
    indent: "  "
    type_mappings:
      time.Time: "string /* RFC 3339, UTC */"
    frontmatter: |
      // Copyright 2026 The Forgejo Authors. All rights reserved.
      // SPDX-License-Identifier: GPL-3.0-or-later
      //
      // Generated by next/tools/gen-protocol.sh from services/livesync/protocol:
      // change the Go types and re-run the script (--check verifies it in CI).
